# oss-blog · Ghost 6 本地运行（Docker Compose）
# 用法：cd runtime && docker compose up -d
# 前台 http://localhost:2368  后台 http://localhost:2368/ghost
#
# 说明：
#  - 数据/主题/上传文件全部落在 ./content（已 gitignore），容器可随时删除重建而不丢数据。
#  - 固定 Ghost 版本镜像 ghost:6.62.0。
#  - 需要把自定义主题放入 content/themes/<theme-name>/ 后重启并激活。
name: oss-blog-ghost

services:
  ghost:
    image: ghost:6.62.0
    container_name: oss-blog-ghost
    restart: unless-stopped
    depends_on:
      - mail-sink
    ports:
      - "2368:2368"
    environment:
      # 站点对外 URL（本地开发直接映射 localhost）
      url: http://localhost:2368
      # 本地使用 SQLite，数据库文件存于挂载卷 content/data/ghost.db
      database__client: sqlite3
      database__connection__filename: content/data/ghost.db
      database__useNullAsDefault: "true"
      # 本地关闭 staff 设备验证邮件 OTP，管理员直接用密码登录（仅本地开发）
      security__staffDeviceVerification: "false"
      # 邮件：转发到本地 mail-sink(SMTP :1025)，收到的 .eml 落盘 runtime/mail/，
      # 会员 magic link / 验证码可离线读取，保证演示与脚本自动化可复现
      mail__transport: smtp
      mail__options__host: mail-sink
      mail__options__port: "1025"
      mail__options__secure: "false"
      mail__from: "sjk 的开源博客 <ghost@localhost.local>"
      NODE_ENV: development
    volumes:
      - ./content:/var/lib/ghost/content
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:2368/ghost/api/admin/site/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 本地邮件接收器：极简 SMTP sink（自建镜像，无需第三方网络，构建自 docker/Dockerfile）
  mail-sink:
    build: ./mail-sink
    image: oss-blog-mail-sink:local
    container_name: oss-blog-mail-sink
    restart: unless-stopped
    volumes:
      - ./mail:/mail
